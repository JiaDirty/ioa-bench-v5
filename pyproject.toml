[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioa-bench"
version = "0.1.0"
description = "Local-first model-centric Internet-of-Agents safety benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
ioabench = "ioabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ioabench = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires an external provider or service",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

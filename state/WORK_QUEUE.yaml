  target.
queue_policy:
  selection: Codex selects the highest-priority unblocked item after reading AGENTS.md,
    PROJECT_STATE.yaml and this queue.
  status_values:
  - ready
  - planned
  - blocked
  - in_progress
  - done
  - failed
  - cancelled
  done_rule: A task is done only when outputs, tests, completion commands, documentation/state
    updates and stated acceptance criteria are satisfied.
  dependency_rule: A blocked item becomes ready only when all depends_on tasks are
    done and no frozen-contract conflict exists.
  bug_rule: Every fixed bug requires a regression test. Material formal-result bugs
    require impact analysis and affected reruns under bumped component versions.
  data_rule: Never lower dataset quality thresholds to hit quota; improve the generation/validation/calibration
    pipeline instead.
  benchmark_rule: Never optimize frozen formal prompts against observed benchmark
    failures; never mutate frozen datasets in place; never silently substitute the
    tested model.
  state_updates: After each done task, update WORK_QUEUE status, PROJECT_STATE, and
    CHANGELOG; create ADR when required by AGENTS.md.

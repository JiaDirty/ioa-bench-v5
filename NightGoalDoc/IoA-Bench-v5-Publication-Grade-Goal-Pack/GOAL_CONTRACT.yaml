non_negotiables:
  - 18 canonical construct meanings unchanged without PI approval
  - No hidden evaluator ground truth or taxonomy leakage to tested model
  - Observable mechanism exposure and action opportunity for formal behavioral claims
  - Distinguish safety, task utility, recovery, invalid, budget, infrastructure, abstention
  - Preserve historical records and append-only experimental attempts
  - No post-hoc score tuning, rerun-to-safe, cherry-picking or quality-gate lowering
  - T361-T363 SIMULATION_ONLY; no unsupported real-human claim
  - Single tested DeepSeek model, no mandatory cross-model comparison
  - Independent human expert review cannot be replaced by AI labels
  - Freeze full protocol and acceptance toolchain before formal campaign
provider_budget:
  new_paid_calls: EXPLICIT_PI_APPROVAL_REQUIRED
  approval_decision: PI-V5-006
  includes: [data_generation, semantic_validation, smoke_test, confirmation_pilot, formal_campaign]
execution_policy:
  - Minimal evidence-driven patch, targeted tests, no speculative defensive layers
  - Preserve usable existing implementation and candidates
  - Verify actual failure before changing scorer or run boundary
  - Run focused AI-generated scenario pilot before scaling to all suites
  - Keep a single state ledger and one active Goal
stop_conditions:
  - external expert review or actual human labels required
  - any new paid Provider operation lacking prior specific approval
  - changes to canonical taxonomy, formal tested model or key paper claim scope
  - unavailable credentials, permissions or original evidence
  - irreversible historical destruction or unresolvable scientific tradeoff
completion_rule: >-
  Declare PUBLICATION_READY only if every applicable Gate A-H is evidenced by current
  frozen artifacts, independent review and the authorized formal campaign, with honest claims.
  Otherwise report in-progress or blocked status with concrete evidence and unlock conditions.
